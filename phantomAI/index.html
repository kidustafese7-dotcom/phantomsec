<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhantomAI</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #212121;
      color: #ececec;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background-color: #171717;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border-right: 1px solid #2f2f2f;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #383838;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
      width: 100%;
    }

    .new-chat-btn:hover {
      background: #212121;
    }

    .chat-history {
      flex: 1;
      margin-top: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      color: #b4b4b4;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-item.active {
      background: #212121;
      color: #fff;
    }

    .status-badge {
      padding: 10px;
      font-size: 0.8rem;
      color: #10a37f;
      border-top: 1px solid #2f2f2f;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .chat-header {
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #b4b4b4;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2f2f2f;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .message-content {
      width: 100%;
      max-width: 768px;
      padding: 0 24px;
      display: flex;
      gap: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user-avatar {
      background-color: #5436da;
      color: #fff;
    }

    .ai-avatar {
      background-color: #10a37f;
      color: #fff;
    }

    .text-body {
      flex: 1;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .text-body p {
      margin-bottom: 12px;
    }

    .text-body p:last-child {
      margin-bottom: 0;
    }

    pre {
      background-color: #0d0d0d;
      border-radius: 6px;
      margin: 12px 0;
      padding: 12px;
      overflow-x: auto;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
    }

    :not(pre) > code {
      background-color: #2f2f2f;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .input-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 20px 24px;
      background: linear-gradient(
        180deg,
        rgba(33, 33, 33, 0) 0%,
        #212121 30%
      );
    }

    .input-box {
      width: 100%;
      max-width: 768px;
      background-color: #2f2f2f;
      border-radius: 26px;
      padding: 10px 16px 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #383838;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      max-height: 200px;
      height: 24px;
      line-height: 1.4;
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #ececec;
      color: #212121;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .disclaimer {
      font-size: 0.75rem;
      color: #8e8e8e;
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .message-content {
        padding: 0 16px;
      }

      .input-container {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div>
      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <i class="fa-solid fa-plus"></i>
        New chat
      </button>

      <div class="chat-history">
        <div class="history-item active">
          <i class="fa-regular fa-message"></i>
          New Conversation
        </div>
      </div>
    </div>

    <div class="status-badge">
      <i class="fa-solid fa-bolt"></i>
      PhantomAI Ready
    </div>
  </aside>


  <main class="main-chat">

    <div class="chat-header">
      <span>PhantomAI</span>
    </div>


    <div
      class="messages-container"
      id="messages-container"
      aria-live="polite"
    >
      <div class="message-row">
        <div class="message-content">

          <div
            class="avatar ai-avatar"
            aria-hidden="true"
          >
            <i class="fa-solid fa-robot"></i>
          </div>

          <div class="text-body">
            How can I help you today?
          </div>

        </div>
      </div>
    </div>


    <div class="input-container">

      <div class="input-box">

        <textarea
          id="user-input"
          placeholder="Message PhantomAI..."
          rows="1"
          maxlength="8000"
          aria-label="Message PhantomAI"
        ></textarea>

        <button
          class="send-btn"
          id="send-btn"
          type="button"
          aria-label="Send message"
        >
          <i class="fa-solid fa-arrow-up"></i>
        </button>

      </div>

      <div class="disclaimer">
        PhantomAI can make mistakes. Check important info.
      </div>

    </div>

  </main>


  <script>
    "use strict";

    /*
     * SECURITY MODEL
     *
     * The browser NEVER receives the Groq API key.
     *
     * Browser
     *    |
     *    | POST /api/chat
     *    v
     * Vercel /api/chat.js
     *    |
     *    | GROQ_API_KEY
     *    v
     * Groq API
     */

    const MAX_INPUT_LENGTH = 8000;
    const MAX_MESSAGES = 50;
    const MAX_RESPONSE_LENGTH = 50000;
    const REQUEST_TIMEOUT = 30000;

    let activeMessages = [];
    let isSending = false;

    const inputEl =
      document.getElementById("user-input");

    const sendBtn =
      document.getElementById("send-btn");

    const newChatBtn =
      document.getElementById("new-chat-btn");

    const container =
      document.getElementById("messages-container");


    /*
     * Resize textarea safely.
     */
    function autoResize(textarea) {
      textarea.style.height = "auto";

      textarea.style.height =
        Math.min(textarea.scrollHeight, 200) + "px";
    }


    /*
     * Handle Enter / Shift+Enter.
     */
    function handleKeyDown(event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        sendMessage();
      }
    }


    /*
     * Start a completely new conversation.
     *
     * Uses DOM APIs instead of innerHTML.
     */
    function startNewChat() {
      activeMessages = [];

      while (container.firstChild) {
        container.removeChild(
          container.firstChild
        );
      }

      createMessageRow(
        "assistant",
        "How can I help you today?"
      );

      inputEl.focus();
    }


    /*
     * Create a message safely.
     *
     * User/AI content is inserted with
     * textContent, not innerHTML.
     */
    function createMessageRow(
      role,
      text = ""
    ) {
      const row =
        document.createElement("div");

      row.className = "message-row";


      const contentDiv =
        document.createElement("div");

      contentDiv.className =
        "message-content";


      const avatarDiv =
        document.createElement("div");

      avatarDiv.className =
        role === "user"
          ? "avatar user-avatar"
          : "avatar ai-avatar";

      avatarDiv.setAttribute(
        "aria-hidden",
        "true"
      );


      const icon =
        document.createElement("i");

      icon.className =
        role === "user"
          ? "fa-solid fa-user"
          : "fa-solid fa-robot";

      avatarDiv.appendChild(icon);


      const textBodyDiv =
        document.createElement("div");

      textBodyDiv.className =
        "text-body";


      if (role === "user") {
        textBodyDiv.classList.add(
          "user-text"
        );
      }


      /*
       * IMPORTANT:
       *
       * textContent treats the response
       * as text rather than executable HTML.
       */
      textBodyDiv.textContent =
        String(text);


      contentDiv.appendChild(
        avatarDiv
      );

      contentDiv.appendChild(
        textBodyDiv
      );

      row.appendChild(
        contentDiv
      );

      container.appendChild(
        row
      );


      container.scrollTop =
        container.scrollHeight;


      return textBodyDiv;
    }


    function appendMessage(
      role,
      text
    ) {
      return createMessageRow(
        role,
        text
      );
    }


    /*
     * Render errors without innerHTML.
     */
    function renderError(
      element,
      message
    ) {
      while (element.firstChild) {
        element.removeChild(
          element.firstChild
        );
      }

      const errorSpan =
        document.createElement("span");

      errorSpan.style.color =
        "#ef4444";

      errorSpan.textContent =
        String(message);

      element.appendChild(
        errorSpan
      );
    }


    /*
     * Send message to our Vercel API.
     *
     * There is NO API key here.
     */
    async function sendMessage() {

      if (isSending) {
        return;
      }


      const text =
        inputEl.value.trim();


      if (!text) {
        return;
      }


      /*
       * Client-side limit.
       *
       * The server must enforce this too.
       */
      if (
        text.length >
        MAX_INPUT_LENGTH
      ) {
        const error =
          createMessageRow(
            "assistant"
          );

        renderError(
          error,
          "Message is too long. Maximum is 8000 characters."
        );

        return;
      }


      if (
        activeMessages.length >=
        MAX_MESSAGES
      ) {
        const error =
          createMessageRow(
            "assistant"
          );

        renderError(
          error,
          "Conversation limit reached. Start a new chat."
        );

        return;
      }


      isSending = true;

      sendBtn.disabled = true;


      /*
       * Display user's message safely.
       */
      appendMessage(
        "user",
        text
      );


      activeMessages.push({
        role: "user",
        content: text
      });


      inputEl.value = "";

      inputEl.style.height =
        "24px";


      /*
       * Temporary AI message.
       */
      const aiTextBody =
        createMessageRow(
          "assistant",
          "Thinking..."
        );


      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          function () {
            controller.abort();
          },
          REQUEST_TIMEOUT
        );


      try {

        /*
         * IMPORTANT:
         *
         * We call our own Vercel endpoint.
         *
         * DO NOT put:
         *
         * Authorization: Bearer gsk_...
         *
         * in this file.
         */
        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              credentials:
                "same-origin",

              body: JSON.stringify({
                messages:
                  activeMessages
              }),

              signal:
                controller.signal
            }
          );


        clearTimeout(timeout);


        if (!response.ok) {

          let errorMessage =
            "AI service unavailable.";


          if (
            response.status === 400
          ) {
            errorMessage =
              "Invalid request.";
          }


          if (
            response.status === 429
          ) {
            errorMessage =
              "Too many requests. Please wait and try again.";
          }


          if (
            response.status === 502
          ) {
            errorMessage =
              "AI provider is temporarily unavailable.";
          }


          if (
            response.status === 504
          ) {
            errorMessage =
              "AI request timed out.";
          }


          renderError(
            aiTextBody,
            errorMessage
          );

          return;
        }


        const data =
          await response.json();


        /*
         * Validate the server response.
         */
        if (
          !data ||
          typeof data.content !==
            "string"
        ) {
          renderError(
            aiTextBody,
            "Invalid AI response."
          );

          return;
        }


        /*
         * Protect the browser from
         * unexpectedly huge responses.
         */
        const fullContent =
          data.content.slice(
            0,
            MAX_RESPONSE_LENGTH
          );


        /*
         * SECURITY:
         *
         * Never use:
         *
         * element.innerHTML =
         * marked.parse(fullContent)
         *
         * AI output is untrusted.
         */
        aiTextBody.textContent =
          fullContent;


        activeMessages.push({
          role: "assistant",
          content: fullContent
        });


        container.scrollTop =
          container.scrollHeight;


      } catch (error) {

        clearTimeout(timeout);


        if (
          error &&
          error.name ===
            "AbortError"
        ) {
          renderError(
            aiTextBody,
            "Request timed out."
          );
        } else {
          /*
           * Don't expose internal
           * exception information.
           */
          renderError(
            aiTextBody,
            "Unable to contact the AI service."
          );
        }

      } finally {

        isSending = false;

        sendBtn.disabled =
          false;

        inputEl.focus();
      }
    }


    /*
     * Event listeners.
     *
     * This removes the need for inline
     * onclick/onkeydown handlers.
     */
    inputEl.addEventListener(
      "input",
      function () {
        autoResize(inputEl);
      }
    );


    inputEl.addEventListener(
      "keydown",
      handleKeyDown
    );


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    newChatBtn.addEventListener(
      "click",
      startNewChat
    );
  </script>

</body>
</html>
