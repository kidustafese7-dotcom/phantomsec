<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhantomAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #212121;
      color: #ececec;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background-color: #171717;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border-right: 1px solid #2f2f2f;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #383838;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
      width: 100%;
    }

    .new-chat-btn:hover {
      background: #212121;
    }

    .chat-history {
      flex: 1;
      margin-top: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      color: #b4b4b4;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-item.active {
      background: #212121;
      color: #fff;
    }

    .status-badge {
      padding: 10px;
      font-size: 0.8rem;
      color: #10a37f;
      border-top: 1px solid #2f2f2f;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .chat-header {
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #b4b4b4;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2f2f2f;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .message-content {
      width: 100%;
      max-width: 768px;
      padding: 0 24px;
      display: flex;
      gap: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user-avatar {
      background-color: #5436da;
      color: #fff;
    }

    .ai-avatar {
      background-color: #10a37f;
      color: #fff;
    }

    .text-body {
      flex: 1;
      overflow-x: auto;
    }

    .text-body.user-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .text-body p {
      margin-bottom: 12px;
    }

    .text-body p:last-child {
      margin-bottom: 0;
    }

    pre {
      background-color: #0d0d0d;
      border-radius: 6px;
      margin: 12px 0;
      padding: 12px;
      overflow-x: auto;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
    }

    :not(pre) > code {
      background-color: #2f2f2f;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .input-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 20px 24px;
      background: linear-gradient(180deg, rgba(33,33,33,0) 0%, #212121 30%);
    }

    .input-box {
      width: 100%;
      max-width: 768px;
      background-color: #2f2f2f;
      border-radius: 26px;
      padding: 10px 16px 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #383838;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      max-height: 200px;
      height: 24px;
      line-height: 1.4;
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #ececec;
      color: #212121;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .disclaimer {
      font-size: 0.75rem;
      color: #8e8e8e;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <button class="new-chat-btn" onclick="startNewChat()">
        <i class="fa-solid fa-plus"></i> New chat
      </button>
      <div class="chat-history">
        <div class="history-item active"><i class="fa-regular fa-message"></i> New Conversation</div>
      </div>
    </div>

    <div class="status-badge">
      <i class="fa-solid fa-bolt"></i> PhantomAI Ready
    </div>
  </aside>

  <main class="main-chat">
    <div class="chat-header">
      <span>PhantomAI</span>
    </div>

    <div class="messages-container" id="messages-container">
      <div class="message-row">
        <div class="message-content">
          <div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>
          <div class="text-body">How can I help you today?</div>
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-box">
        <textarea id="user-input" placeholder="Message PhantomAI..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
      <div class="disclaimer">PhantomAI can make mistakes. Check important info.</div>
    </div>
  </main>

  <script>
    const _sec = "Z3NrX2NQYzM5SjBwR2EwTFJUbThkNDVJV0dkeWIzRlloMnFUWDJScUluWVk4NXJFclNUTG5ZVkU=";
    const SELECTED_MODEL = "qwen/qwen3.8-27b";
    let activeMessages = [];

    function getApiKey() {
      return localStorage.getItem('groq_key') || atob(_sec);
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function startNewChat() {
      activeMessages = [];
      document.getElementById('messages-container').innerHTML = `
        <div class="message-row">
          <div class="message-content">
            <div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="text-body">How can I help you today?</div>
          </div>
        </div>
      `;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();

      if (!text) return;

      appendMessage('user', text);
      activeMessages.push({ role: 'user', content: text });

      inputEl.value = '';
      inputEl.style.height = '24px';

      const aiTextBody = createMessageRow('assistant');
      
      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getApiKey()}`
          },
          body: JSON.stringify({
            messages: activeMessages,
            model: SELECTED_MODEL
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          renderError(aiTextBody, `API Error: ${errData.error?.message || response.statusText}`);
          return;
        }

        const data = await response.json();
        const fullContent = data.choices[0]?.message?.content || 'No response returned.';

        aiTextBody.innerHTML = DOMPurify.sanitize(marked.parse(fullContent));
        hljs.highlightAll();
        
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;

        activeMessages.push({ role: 'assistant', content: fullContent });

      } catch (err) {
        renderError(aiTextBody, `Network Error: ${err.message}`);
      }
    }

    function appendMessage(role, text) {
      const container = document.getElementById('messages-container');
      const row = document.createElement('div');
      row.className = 'message-row';
      
      const avatarClass = role === 'user' ? 'user-avatar' : 'ai-avatar';
      const iconClass = role === 'user' ? 'fa-user' : 'fa-robot';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      const avatarDiv = document.createElement('div');
      avatarDiv.className = `avatar ${avatarClass}`;
      avatarDiv.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

      const textBodyDiv = document.createElement('div');
      textBodyDiv.className = 'text-body';

      if (role === 'user') {
        textBodyDiv.classList.add('user-text');
        textBodyDiv.textContent = text;
      } else {
        textBodyDiv.innerHTML = DOMPurify.sanitize(marked.parse(text));
      }

      contentDiv.appendChild(avatarDiv);
      contentDiv.appendChild(textBodyDiv);
      row.appendChild(contentDiv);
      container.appendChild(row);

      hljs.highlightAll();
      container.scrollTop = container.scrollHeight;
    }

    function createMessageRow(role) {
      const container = document.getElementById('messages-container');
      const row = document.createElement('div');
      row.className = 'message-row';
      
      const avatarClass = role === 'user' ? 'user-avatar' : 'ai-avatar';
      const iconClass = role === 'user' ? 'fa-user' : 'fa-robot';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      const avatarDiv = document.createElement('div');
      avatarDiv.className = `avatar ${avatarClass}`;
      avatarDiv.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

      const textBodyDiv = document.createElement('div');
      textBodyDiv.className = 'text-body';
      textBodyDiv.textContent = 'Thinking...';

      contentDiv.appendChild(avatarDiv);
      contentDiv.appendChild(textBodyDiv);
      row.appendChild(contentDiv);
      container.appendChild(row);

      container.scrollTop = container.scrollHeight;
      return textBodyDiv;
    }

    function renderError(element, message) {
      element.innerHTML = '';
      const errSpan = document.createElement('span');
      errSpan.style.color = '#ef4444';
      errSpan.textContent = message;
      element.appendChild(errSpan);
    }
  </script>
</body>
</html>
