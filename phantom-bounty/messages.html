<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Messages — phantom-bounty</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="messages">
  <header>
    <div class="wrap nav">
      <a class="brand" href="index.html">◈ phantom<span>-bounty</span></a>
      <nav class="navlinks">
        <a href="index.html">Hunt vulnerabilities</a>
        <a href="researchers.html">Researchers</a>
        <a href="community.html">Community</a>
        <a href="reports.html">Reports</a>
        <a href="messages.html" class="active">Messages</a>
      </nav>
      <div class="navright" id="navRight"></div>
    </div>
  </header>

  <div class="wrap layout">
    <aside class="sidebar">
      <div class="sideprofile" id="sideProfileInfo"></div>
      <div class="side-menu">
        <a href="index.html">Hunt vulnerabilities</a>
        <a href="researchers.html">Discover researchers</a>
        <a href="reports.html">Vulnerability reports</a>
        <a href="community.html">Community</a>
        <a href="messages.html" class="active">Messages</a>
        <a href="profile.html">My profile</a>
      </div>
    </aside>

    <main class="main">
      <div class="card chat-layout">
        <div class="chat-list" id="chatList">
          <div class="muted small" style="padding:10px">Loading chats...</div>
        </div>
        <div class="chat-window">
          <div class="chat-title" id="chatHeader">Select a conversation</div>
          <div class="messages" id="messageList">
            <div class="empty">Select or start a conversation to start messaging.</div>
          </div>
          <form class="chat-compose hidden" id="chatForm">
            <input class="field" id="msgInput" placeholder="Type your message..." required autocomplete="off">
            <button class="btn primary" type="submit">Send</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
