<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — phantom-bounty</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="signup">
  <div class="auth-screen">
    <section class="auth-art">
      <div class="brand">phantom<span>-bounty</span></div>
      <h1>Join the Platform.</h1>
      <p>Connect with top security researchers or publish authorized bounty programs to secure your applications.</p>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-form">
        <h2>Create an Account</h2>

        <div id="authAlert" class="error hidden"></div>

        <form id="signupForm">
          <div class="formrow">
            <label for="displayName">Full Name or Security Handle *</label>
            <input class="field" id="displayName" name="displayName" type="text" required placeholder="e.g. Alex Vance">
          </div>

          <div class="formrow">
            <label for="role">I want to *</label>
            <select class="field" id="role" name="role" required>
              <option value="hunter">Bug Bounty Hunter (Security Researcher)</option>
              <option value="company">Company / Organization Manager</option>
            </select>
          </div>

          <div class="formrow">
            <label for="email">Email Address *</label>
            <input class="field" id="email" name="email" type="email" autocomplete="email" required placeholder="name@domain.com">
          </div>

          <div class="formrow">
            <label for="password">Password *</label>
            <input class="field" id="password" name="password" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters">
          </div>

          <button class="btn primary" id="submitBtn" style="width:100%; margin-top:18px" type="submit">
            Create Account
          </button>
        </form>

        <p style="margin-top:20px; font-size:14px; text-align:center" class="muted">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </section>
  </div>

  <!-- Firebase v10 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <script>
    // Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyC1_m2aMJeAW93BkgQ0VUM9KdtzT2OZelM",
      authDomain: "phantomsec-ca297.firebaseapp.com",
      databaseURL: "https://phantomsec-ca297-default-rtdb.firebaseio.com",
      projectId: "phantomsec-ca297",
      storageBucket: "phantomsec-ca297.firebasestorage.app",
      messagingSenderId: "15497490169",
      appId: "1:15497490169:web:a8454e1ed0fda9de04fc28"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    const alertBox = document.getElementById('authAlert');
    const submitBtn = document.getElementById('submitBtn');

    // Auto-redirect if user is already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });

    // Helper function to format Firebase error codes
    function getErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use':
          return 'An account with this email address already exists.';
        case 'auth/invalid-email':
          return 'Please enter a valid email address.';
        case 'auth/weak-password':
          return 'Password must be at least 6 characters long.';
        case 'auth/operation-not-allowed':
          return 'Email/password accounts are not enabled in Firebase Auth.';
        default:
          return 'An error occurred during account creation. Please try again.';
      }
    }

    // Sign Up Form Submission
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      alertBox.classList.add('hidden');
      alertBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      const displayName = document.getElementById('displayName').value.trim();
      const role = document.getElementById('role').value;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        // 1. Create Authentication User
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // 2. Update Auth Display Name Profile
        await user.updateProfile({ displayName });

        // 3. Write Full User Profile to Realtime Database
        await db.ref('profiles/' + user.uid).set({
          uid: user.uid,
          email: user.email,
          displayName: displayName,
          role: role,
          bio: role === 'hunter' ? 'Independent Security Researcher' : 'Security Program Manager',
          location: 'Remote',
          createdAt: Date.now()
        });

        window.location.href = 'index.html';
      } catch (err) {
        alertBox.textContent = getErrorMessage(err.code);
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
