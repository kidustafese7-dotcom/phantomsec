<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Security - Admin Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --color-bg: #050508;
            --color-neon-green: #00ff41;
            --color-cyan: #00ffff;
            --color-purple: #8a2be2;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: white;
            overflow: hidden;
        }

        .font-mono, h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', monospace;
        }

        .cyber-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0a1118 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050508;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff4140;
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-[#050508]">
        <div class="absolute inset-0 cyber-grid opacity-50"></div>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#00ff41] rounded-full mix-blend-screen filter blur-[150px] opacity-10"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[#00ffff] rounded-full mix-blend-screen filter blur-[150px] opacity-10"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-[#8a2be2] rounded-full mix-blend-screen filter blur-[200px] opacity-[0.03]"></div>
        
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.03] text-[#00ff41] flex items-center justify-center">
            <i data-lucide="shield-check" class="w-[800px] h-[800px]" stroke-width="0.5"></i>
        </div>

        <canvas id="bg-canvas" class="absolute inset-0"></canvas>
    </div>

    <div class="relative z-10 w-full max-w-[420px]">
        <div class="absolute -inset-1 bg-gradient-to-r from-[#00ff41]/20 to-[#00ffff]/20 rounded-2xl blur-lg opacity-50"></div>
        
        <div class="relative bg-[#0a1118]/80 backdrop-blur-xl border border-[#00ff41]/30 rounded-2xl p-8 shadow-[0_0_40px_rgba(0,255,65,0.1)]">
            
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div class="relative">
                        <i data-lucide="shield-check" class="text-[#00ff41] w-12 h-12" stroke-width="1.5"></i>
                        <div class="absolute inset-0 bg-[#00ff41] blur-md opacity-30"></div>
                    </div>
                </div>
                
                <h1 class="text-2xl font-mono font-bold tracking-wider text-white mb-1">
                    PHANTOM SECURITY
                </h1>
                
                <div class="flex items-center justify-center gap-2 mb-3">
                    <div class="w-2 h-2 rounded-full bg-[#00ff41] animate-pulse shadow-[0_0_10px_#00ff41]"></div>
                    <span class="text-[10px] font-mono tracking-[0.2em] text-[#00ff41]">
                        SECURE ADMIN PORTAL
                    </span>
                </div>
                
                <h2 class="text-sm font-semibold tracking-widest text-gray-300 mb-2 border-b border-gray-800 pb-3">
                    ADMINISTRATOR ACCESS
                </h2>
                
                <p class="text-xs text-gray-500 mt-2">
                    Authorized personnel only. All access attempts are logged and monitored.
                </p>
            </div>

            <form id="loginForm" class="space-y-5">
                
                <div class="space-y-1.5">
                    <label for="username" class="block text-xs font-medium text-gray-400 uppercase tracking-wider">
                        Username or Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="h-4 w-4 text-gray-500"></i>
                        </div>
                        <input
                            id="username"
                            type="text"
                            class="block w-full pl-10 pr-3 py-2.5 bg-[#05080f]/80 border border-gray-800 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-[#00ff41] focus:border-[#00ff41] transition-colors sm:text-sm"
                            placeholder="Enter username or email"
                            autocomplete="username"
                            required
                        />
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="block text-xs font-medium text-gray-400 uppercase tracking-wider">
                        Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="h-4 w-4 text-gray-500"></i>
                        </div>
                        <input
                            id="password"
                            type="password"
                            class="block w-full pl-10 pr-10 py-2.5 bg-[#05080f]/80 border border-gray-800 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-[#00ff41] focus:border-[#00ff41] transition-colors sm:text-sm"
                            placeholder="Enter administrator password"
                            autocomplete="current-password"
                            required
                        />
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-300 focus:outline-none"
                            title="Toggle Password Visibility"
                        >
                            <i data-lucide="eye" id="eyeIcon" class="h-4 w-4"></i>
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="hidden items-center gap-2 p-3 rounded bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                    <i data-lucide="alert-triangle" class="h-4 w-4 flex-shrink-0"></i>
                    <span id="errorText">Invalid credentials.</span>
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-[#050508] bg-[#00ff41] hover:bg-[#00cc33] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#0a1118] focus:ring-[#00ff41] transition-all mt-6 group"
                >
                    <span id="btnText" class="flex items-center">
                        SIGN IN
                        <i data-lucide="terminal" class="ml-2 h-4 w-4 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                    </span>
                    <span id="btnLoader" class="hidden flex items-center">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-[#050508]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        AUTHENTICATING...
                    </span>
                </button>
            </form>

            <div class="mt-8 flex items-center justify-center text-[10px] text-gray-600 font-mono gap-4 border-t border-gray-800/50 pt-4">
                <span class="flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> 256-bit AES</span>
                <span class="flex items-center gap-1"><i data-lucide="activity" class="w-3 h-3"></i> System Nominal</span>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 255, 65, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 255, 65, ${0.1 - distance / 1200})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawLines();
            requestAnimationFrame(animate);
        }

        animate();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        let isPasswordVisible = false;

        togglePassword.addEventListener('click', () => {
            isPasswordVisible = !isPasswordVisible;
            passwordInput.type = isPasswordVisible ? 'text' : 'password';
            eyeIcon.setAttribute('data-lucide', isPasswordVisible ? 'eye-off' : 'eye');
            lucide.createIcons();
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1_m2aMJeAW93BkgQ0VUM9KdtzT2OZelM",
            authDomain: "phantomsec-ca297.firebaseapp.com",
            projectId: "phantomsec-ca297",
            storageBucket: "phantomsec-ca297.firebasestorage.app",
            messagingSenderId: "15497490169",
            appId: "1:15497490169:web:a8454e1ed0fda9de04fc28",
            measurementId: "G-G0LKRPYMXW"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const rawInput = usernameInput.value.trim();
            const password = passwordInput.value;

            const email = rawInput.includes('@') 
                ? rawInput 
                : `${rawInput}@phantomsec.com`;

            errorMessage.classList.add('hidden');
            errorMessage.classList.remove('flex');

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            usernameInput.disabled = true;
            passwordInput.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log("Authentication successful:", userCredential.user.email);
                
                // Redirects to admin.html on success
                window.location.href = "admin.html";

            } catch (error) {
                console.error("Firebase Login Error:", error.code, error.message);

                errorMessage.classList.remove('hidden');
                errorMessage.classList.add('flex');
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorText.textContent = "Invalid administrator credentials.";
                } else if (error.code === 'auth/too-many-requests') {
                    errorText.textContent = "Account temporarily locked due to failed attempts.";
                } else {
                    errorText.textContent = error.message.replace("Firebase: ", "");
                }

                passwordInput.value = '';
                passwordInput.focus();
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                usernameInput.disabled = false;
                passwordInput.disabled = false;
            }
        });
    </script>
</body>
</html>
