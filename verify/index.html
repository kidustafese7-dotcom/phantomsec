<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Chat</title>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.2),
                    transparent 35%
                ),
                #0b1020;
            color: #fff;
            overflow: hidden;
        }

        /* =========================
           LOGIN SCREEN
        ========================= */

        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.25),
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.2),
                    transparent 40%
                ),
                #080d1a;
        }

        .login-box {
            width: min(420px, 100%);

            padding: 35px;

            background: rgba(15, 23, 42, 0.9);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .login-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            font-size: 30px;

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.35);
        }

        .login-box h1 {
            margin: 0 0 8px;

            font-size: 26px;
        }

        .login-box p {
            margin: 0 0 25px;

            color: #94a3b8;

            font-size: 14px;
        }

        .login-input {
            width: 100%;
            height: 50px;

            margin-bottom: 12px;

            padding: 0 16px;

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.06);

            color: #fff;

            font-size: 14px;

            transition: 0.25s ease;
        }

        .login-input::placeholder {
            color: #64748b;
        }

        .login-input:focus {
            border-color: #8b5cf6;

            background: rgba(255, 255, 255, 0.09);

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        #loginButton {
            width: 100%;
            height: 50px;

            margin-top: 8px;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            color: #fff;

            font-size: 15px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 8px 25px rgba(99, 102, 241, 0.3);

            transition: 0.25s ease;
        }

        #loginButton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(139, 92, 246, 0.45);
        }

        #loginButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #loginError {
            display: none;

            margin-top: 15px;
            padding: 10px;

            border-radius: 10px;

            color: #fca5a5;

            background: rgba(239, 68, 68, 0.1);

            border: 1px solid rgba(239, 68, 68, 0.2);

            font-size: 13px;
        }

        /* =========================
           CHAT HEADER
        ========================= */

        .chat-header {
            position: fixed;

            top: 0;
            left: 50%;

            transform: translateX(-50%);

            width: min(700px, calc(100% - 40px));

            height: 70px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 0 24px;

            background: rgba(15, 23, 42, 0.88);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 0 0 18px 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);

            z-index: 10;
        }

        .chat-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            font-size: 20px;

            box-shadow:
                0 5px 18px rgba(99, 102, 241, 0.35);
        }

        .chat-title {
            font-size: 20px;
            font-weight: 700;
        }

        .online-status {
            margin-left: auto;

            display: flex;
            align-items: center;

            gap: 7px;

            color: #94a3b8;

            font-size: 12px;
        }

        .online-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px #22c55e;
        }

        #logoutButton {
            margin-left: 12px;

            padding: 7px 10px;

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 8px;

            cursor: pointer;

            color: #cbd5e1;

            background: rgba(255, 255, 255, 0.05);

            font-size: 11px;
        }

        #logoutButton:hover {
            color: #fff;

            background: rgba(239, 68, 68, 0.15);

            border-color: rgba(239, 68, 68, 0.3);
        }

        /* =========================
           MESSAGES
        ========================= */

        #messages {
            position: fixed;

            top: 85px;
            bottom: 105px;

            left: 50%;

            transform: translateX(-50%);

            width: min(700px, calc(100% - 40px));

            margin: 0;

            padding: 15px 8px 25px;

            list-style: none;

            overflow-y: auto;

            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);

            border-radius: 10px;
        }

        #messages li {
            width: fit-content;

            max-width: 80%;

            margin: 0 0 13px;

            padding: 12px 15px;

            border-radius: 17px 17px 17px 5px;

            background: rgba(30, 41, 59, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.07);

            color: #e2e8f0;

            font-size: 14px;

            line-height: 1.5;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.15);

            animation: messageIn 0.25s ease-out;

            word-break: break-word;
        }

        #messages li button {
            margin-left: 10px;

            padding: 5px 9px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            color: #fca5a5;

            background: rgba(239, 68, 68, 0.12);

            font-size: 11px;
        }

        #messages li button:hover {
            color: #fff;

            background: #ef4444;
        }

        /* =========================
           MESSAGE FORM
        ========================= */

        form {
            position: fixed;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            width: min(700px, calc(100% - 40px));

            display: flex;

            gap: 10px;

            padding: 12px;

            background: rgba(15, 23, 42, 0.9);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 18px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);

            z-index: 20;
        }

        #message {
            flex: 1;

            min-width: 0;

            height: 48px;

            padding: 0 17px;

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 13px;

            outline: none;

            background: rgba(255, 255, 255, 0.07);

            color: #fff;

            font-size: 15px;
        }

        #message::placeholder {
            color: #94a3b8;
        }

        #message:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        input[type="submit"] {
            height: 48px;

            padding: 0 23px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: #fff;

            font-size: 15px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 7px 20px rgba(99, 102, 241, 0.3);

            transition: 0.25s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .login-box {
                padding: 28px 20px;
            }

            .chat-header {
                width: calc(100% - 20px);

                height: 60px;

                padding: 0 16px;
            }

            .chat-icon {
                width: 36px;
                height: 36px;

                font-size: 17px;
            }

            .chat-title {
                font-size: 18px;
            }

            .online-status {
                font-size: 11px;
            }

            #logoutButton {
                margin-left: 5px;
                padding: 6px 8px;
            }

            #messages {
                top: 70px;
                bottom: 90px;

                width: calc(100% - 20px);
            }

            #messages li {
                max-width: 88%;
            }

            form {
                width: calc(100% - 20px);

                bottom: 10px;

                padding: 9px;

                border-radius: 15px;
            }

            #message {
                height: 45px;
            }

            input[type="submit"] {
                height: 45px;

                padding: 0 17px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN SCREEN
    ========================= -->

    <div id="loginScreen">

        <div class="login-box">

            <div class="login-icon">
                💬
            </div>

            <h1>Phantom Chat</h1>

            <p>
                Sign in with your Firebase account
            </p>

            <input
                id="loginEmail"
                class="login-input"
                type="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <input
                id="loginPassword"
                class="login-input"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="button">
                Sign In
            </button>

            <div id="loginError"></div>

        </div>

    </div>


    <!-- =========================
         CHAT
    ========================= -->

    <header class="chat-header">

        <div class="chat-icon">
            💬
        </div>

        <div class="chat-title">
            Phantom Chat
        </div>

        <div class="online-status">
            <span class="online-dot"></span>
            Online
        </div>

        <button id="logoutButton" type="button">
            Logout
        </button>

    </header>


    <!-- Messages -->

    <ul id="messages"></ul>


    <!-- Send message -->

    <form id="messageForm">

        <input
            id="message"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
            maxlength="1000"
            required
        >

        <input
            type="submit"
            value="Send"
        >

    </form>


    <script>

        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================

        var firebaseConfig = {
            apiKey: "AIzaSyC1_m2aMJeAW93BkgQ0VUM9KdtzT2OZelM",
            authDomain: "phantomsec-ca297.firebaseapp.com",
            databaseURL: "https://phantomsec-ca297-default-rtdb.firebaseio.com",
            projectId: "phantomsec-ca297",
            storageBucket: "phantomsec-ca297.firebasestorage.app",
            messagingSenderId: "15497490169",
            appId: "1:15497490169:web:a8454e1ed0fda9de04fc28"
        };


        // Initialize Firebase

        firebase.initializeApp(firebaseConfig);


        // Firebase services

        var auth = firebase.auth();

        var database = firebase.database();


        // Current Firebase user

        var currentUser = null;


        // ==========================================
        // ELEMENTS
        // ==========================================

        var loginScreen =
            document.getElementById("loginScreen");

        var loginEmail =
            document.getElementById("loginEmail");

        var loginPassword =
            document.getElementById("loginPassword");

        var loginButton =
            document.getElementById("loginButton");

        var loginError =
            document.getElementById("loginError");

        var logoutButton =
            document.getElementById("logoutButton");

        var messageForm =
            document.getElementById("messageForm");

        var messageInput =
            document.getElementById("message");

        var messages =
            document.getElementById("messages");


        // ==========================================
        // INITIAL AUTH STATE
        // ==========================================

        auth.onAuthStateChanged(function(user) {

            if (user) {

                // User is logged in

                currentUser = user;

                loginScreen.style.display = "none";

                loadMessages();

            } else {

                // User is logged out

                currentUser = null;

                loginScreen.style.display = "flex";

                messages.innerHTML = "";

            }

        });


        // ==========================================
        // LOGIN
        // ==========================================

        loginButton.addEventListener("click", function() {

            var email =
                loginEmail.value.trim();

            var password =
                loginPassword.value;


            if (!email || !password) {

                showLoginError(
                    "Please enter your email and password."
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent =
                "Signing in...";

            hideLoginError();


            auth.signInWithEmailAndPassword(
                email,
                password
            )

            .then(function(result) {

                currentUser =
                    result.user;

            })

            .catch(function(error) {

                var message =
                    "Login failed.";

                switch (error.code) {

                    case "auth/user-not-found":
                        message =
                            "No account found with this email.";
                        break;

                    case "auth/wrong-password":
                        message =
                            "Incorrect password.";
                        break;

                    case "auth/invalid-email":
                        message =
                            "Please enter a valid email address.";
                        break;

                    case "auth/user-disabled":
                        message =
                            "This account has been disabled.";
                        break;

                    case "auth/too-many-requests":
                        message =
                            "Too many attempts. Please try again later.";
                        break;

                    case "auth/invalid-credential":
                        message =
                            "Invalid email or password.";
                        break;
                }

                showLoginError(message);

            })

            .finally(function() {

                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

            });

        });


        // ==========================================
        // ENTER KEY LOGIN
        // ==========================================

        loginPassword.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    loginButton.click();
                }

            }
        );


        // ==========================================
        // LOGIN ERROR
        // ==========================================

        function showLoginError(message) {

            loginError.textContent =
                message;

            loginError.style.display =
                "block";

        }


        function hideLoginError() {

            loginError.style.display =
                "none";

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        logoutButton.addEventListener(
            "click",
            function() {

                auth.signOut();

            }
        );


        // ==========================================
        // SEND MESSAGE
        // ==========================================

        messageForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                if (!currentUser) {
                    return;
                }


                var message =
                    messageInput.value.trim();


                if (!message) {
                    return;
                }


                database
                    .ref("messages")
                    .push({
                        sender: currentUser.email,
                        uid: currentUser.uid,
                        message: message,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });


                messageInput.value = "";

                messageInput.focus();

            }
        );


        // ==========================================
        // LOAD MESSAGES
        // ==========================================

        function loadMessages() {

            messages.innerHTML = "";


            database
                .ref("messages")
                .off("child_added");

            database
                .ref("messages")
                .off("child_removed");


            database
                .ref("messages")
                .on(
                    "child_added",
                    function(snapshot) {

                        var data =
                            snapshot.val();

                        var li =
                            document.createElement("li");


                        li.id =
                            "message-" +
                            snapshot.key;


                        var text =
                            document.createTextNode(
                                data.sender +
                                ": " +
                                data.message +
                                " "
                            );


                        li.appendChild(text);


                        // Delete own messages

                        if (
                            currentUser &&
                            data.uid === currentUser.uid
                        ) {

                            var button =
                                document.createElement(
                                    "button"
                                );

                            button.type =
                                "button";

                            button.textContent =
                                "Delete";

                            button.setAttribute(
                                "data-id",
                                snapshot.key
                            );


                            button.onclick =
                                function() {

                                    deleteMessage(
                                        this
                                    );

                                };


                            li.appendChild(button);

                        }


                        messages.appendChild(li);


                        // Scroll to newest

                        messages.scrollTop =
                            messages.scrollHeight;

                    }
                );


            // Deleted messages

            database
                .ref("messages")
                .on(
                    "child_removed",
                    function(snapshot) {

                        var messageElement =
                            document.getElementById(
                                "message-" +
                                snapshot.key
                            );


                        if (messageElement) {

                            messageElement.textContent =
                                "This message has been removed";

                        }

                    }
                );

        }


        // ==========================================
        // DELETE MESSAGE
        // ==========================================

        function deleteMessage(button) {

            if (!currentUser) {
                return;
            }


            var messageId =
                button.getAttribute(
                    "data-id"
                );


            database
                .ref("messages")
                .child(messageId)
                .once("value")
                .then(function(snapshot) {

                    var data =
                        snapshot.val();


                    // Only allow the owner
                    // to delete the message

                    if (
                        data &&
                        data.uid === currentUser.uid
                    ) {

                        return database
                            .ref("messages")
                            .child(messageId)
                            .remove();

                    }

                });

        }

    </script>

</body>
</html>
