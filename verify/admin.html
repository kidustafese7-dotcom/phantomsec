<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Security - Secure Chat Matrix</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            display: none;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        .font-mono, h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', monospace;
        }
        .cyber-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: #00ff4140; border-radius: 4px; }
    </style>
</head>
<body id="dashboardBody" class="relative h-screen bg-[#050508] text-white flex flex-col">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute inset-0 cyber-grid opacity-40"></div>
        <div class="absolute top-0 right-1/4 w-[600px] h-[600px] bg-[#00ff41] rounded-full mix-blend-screen filter blur-[200px] opacity-5"></div>
        <div class="absolute bottom-0 left-1/4 w-[600px] h-[600px] bg-[#00ffff] rounded-full mix-blend-screen filter blur-[200px] opacity-5"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full">
        <!-- Header -->
        <header class="border-b border-[#00ff41]/20 bg-[#0a1118]/80 backdrop-blur-xl shrink-0">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <i data-lucide="shield-check" class="text-[#00ff41] w-8 h-8"></i>
                        <div class="absolute inset-0 bg-[#00ff41] blur-md opacity-30"></div>
                    </div>
                    <div>
                        <h1 class="font-mono text-lg font-bold tracking-wider text-white">PHANTOM SECURITY</h1>
                        <p class="text-[10px] font-mono text-[#00ff41] tracking-widest uppercase">Global Telegram-Style Matrix</p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#05080f] border border-gray-800 text-xs font-mono">
                        <div class="w-2 h-2 rounded-full bg-[#00ff41] animate-pulse"></div>
                        <span id="userEmailDisplay" class="text-gray-300">Loading...</span>
                    </div>

                    <button 
                        id="logoutBtn"
                        type="button"
                        class="flex items-center gap-2 px-4 py-2 rounded-lg border border-red-500/30 bg-red-500/10 text-red-400 hover:bg-red-500/20 hover:border-red-500/60 active:scale-95 transition-all text-xs font-mono font-bold cursor-pointer"
                    >
                        <i data-lucide="log-out" id="logoutIcon" class="w-4 h-4"></i>
                        <span id="logoutText">TERMINATE SESSION</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Chat Area Filling the Screen -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex gap-6 overflow-hidden">
            
            <!-- Users Sidebar pulled live from Firestore 'users' collection -->
            <div class="w-72 rounded-xl bg-[#0a1118]/80 border border-gray-800 p-4 font-mono text-xs backdrop-blur-md flex flex-col shrink-0">
                <div class="flex items-center justify-between border-b border-gray-800 pb-3 mb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4 text-[#00ff41]"></i>
                        <span class="font-bold text-gray-200">FIRESTORE USERS</span>
                    </div>
                    <span id="userCount" class="text-[10px] bg-[#00ff41]/10 text-[#00ff41] px-2 py-0.5 rounded border border-[#00ff41]/20">0</span>
                </div>
                <div id="usersSidebarList" class="flex-1 overflow-y-auto space-y-2 text-gray-300">
                    <p class="text-gray-500">Syncing database...</p>
                </div>
            </div>

            <!-- Chat Room Main Window -->
            <div class="flex-1 rounded-xl bg-[#0a1118]/80 border border-[#00ff41]/20 backdrop-blur-md flex flex-col overflow-hidden shadow-[0_0_30px_rgba(0,255,65,0.05)]">
                <div class="flex items-center justify-between border-b border-gray-800 px-5 py-4 bg-[#05080f]/50 shrink-0">
                    <div class="flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4 text-[#00ff41]"></i>
                        <div>
                            <span class="font-bold font-mono text-sm text-gray-200 block">GLOBAL TELEGRAM GROUP</span>
                            <span class="text-[10px] text-gray-400 font-mono">100% Real-time sync across all connected clients</span>
                        </div>
                    </div>
                    <span class="text-[10px] font-mono text-[#00ff41] bg-[#00ff41]/10 px-2.5 py-1 rounded-full border border-[#00ff41]/30">LIVE </span>
                </div>

                <!-- Chat Messages Log Feed -->
                <div id="chatFeed" class="flex-1 overflow-y-auto p-5 space-y-3 font-sans text-sm flex flex-col">
                    <!-- Messages dynamically inserted here -->
                </div>

                <!-- Message Input Form -->
                <form id="chatForm" class="p-4 border-t border-gray-800 bg-[#05080f]/50 flex items-center gap-3 shrink-0">
                    <input 
                        type="text" 
                        id="chatInput" 
                        placeholder="Type message to everyone..." 
                        autocomplete="off"
                        required
                        class="flex-1 bg-[#05080f] border border-gray-800 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-[#00ff41] focus:border-[#00ff41] text-sm"
                    />
                    <button 
                        type="submit" 
                        class="bg-[#00ff41] hover:bg-[#00cc33] text-[#050508] font-bold font-mono px-5 py-3 rounded-lg transition-all flex items-center gap-2 cursor-pointer"
                    >
                        <span>SEND</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1_m2aMJeAW93BkgQ0VUM9KdtzT2OZelM",
            authDomain: "phantomsec-ca297.firebaseapp.com",
            projectId: "phantomsec-ca297",
            storageBucket: "phantomsec-ca297.firebasestorage.app",
            messagingSenderId: "15497490169",
            appId: "1:15497490169:web:a8454e1ed0fda9de04fc28",
            measurementId: "G-G0LKRPYMXW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const logoutBtn = document.getElementById('logoutBtn');
        const logoutText = document.getElementById('logoutText');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const chatFeed = document.getElementById('chatFeed');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const usersSidebarList = document.getElementById('usersSidebarList');
        const userCount = document.getElementById('userCount');

        let currentUser = null;

        // 100% Real Authentication State & User Registry Sync
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.body.style.display = "flex";
                userEmailDisplay.textContent = user.email;

                // Explicitly register/update user profile in Firestore 'users' collection with email
                const userDocRef = doc(db, "users", user.uid);
                await setDoc(userDocRef, {
                    uid: user.uid,
                    email: user.email,
                    online: true,
                    lastSeen: serverTimestamp()
                }, { merge: true });

                // Clean up presence status on accidental tab close / disconnect
                window.addEventListener('beforeunload', () => {
                    navigator.sendBeacon ? null : setDoc(userDocRef, { online: false }, { merge: true });
                });

                initRealtimeChatAndUsers();
            } else {
                window.location.replace("index.html");
            }
        });

        // Setup real-time listeners for both global messages and all registered/active users
        function initRealtimeChatAndUsers() {
            // 1. Real-time Message Stream (Telegram group style)
            const messagesQuery = query(collection(db, "global_chat"), orderBy("timestamp", "asc"));
            onSnapshot(messagesQuery, (snapshot) => {
                chatFeed.innerHTML = "";
                snapshot.docs.forEach(docSnap => {
                    const msg = docSnap.data();
                    const isMe = msg.sender === currentUser.email;

                    const msgWrapper = document.createElement('div');
                    msgWrapper.className = `flex flex-col max-w-[70%] ${isMe ? 'self-end items-end' : 'self-start items-start'} mb-3`;

                    const senderLabel = document.createElement('span');
                    senderLabel.className = 'text-[10px] font-mono text-gray-400 mb-1 px-1';
                    senderLabel.textContent = msg.sender;

                    const bubble = document.createElement('div');
                    bubble.className = `p-3 rounded-lg text-sm leading-relaxed shadow-md ${isMe ? 'bg-[#00ff41]/20 border border-[#00ff41]/30 text-white rounded-br-none' : 'bg-[#05080f] border border-gray-800 text-gray-200 rounded-bl-none'}`;
                    bubble.textContent = msg.text;

                    msgWrapper.appendChild(senderLabel);
                    msgWrapper.appendChild(bubble);
                    chatFeed.appendChild(msgWrapper);
                });
                chatFeed.scrollTop = chatFeed.scrollHeight;
            });

            // 2. Real-time Firebase Users List (Shows all registered user emails in database)
            onSnapshot(collection(db, "users"), (snapshot) => {
                usersSidebarList.innerHTML = "";
                let count = 0;
                snapshot.docs.forEach(docSnap => {
                    const userData = docSnap.data();
                    count++;
                    
                    const userItem = document.createElement('div');
                    userItem.className = 'flex items-center gap-2.5 p-2 rounded bg-gray-900/40 border border-gray-800/60 hover:bg-gray-800/50 transition-colors';
                    userItem.innerHTML = `
                        <div class="w-2 h-2 rounded-full ${userData.online ? 'bg-[#00ff41] shadow-[0_0_8px_#00ff41]' : 'bg-gray-600'}"></div>
                        <span class="truncate text-gray-300 font-mono text-xs">${userData.email || 'Unknown User'}</span>
                    `;
                    usersSidebarList.appendChild(userItem);
                });
                userCount.textContent = count;
                if (count === 0) {
                    usersSidebarList.innerHTML = `<p class="text-gray-500">No users found in database.</p>`;
                }
            });
        }

        // Send Message to Firestore Global Group
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "global_chat"), {
                    text: text,
                    sender: currentUser.email,
                    timestamp: serverTimestamp()
                });
                chatInput.value = "";
            } catch (err) {
                console.error("Error sending message:", err);
            }
        });

        // 100% Real Logout Handler
        logoutBtn.addEventListener('click', async () => {
            try {
                logoutBtn.disabled = true;
                logoutBtn.classList.add('opacity-50', 'cursor-not-allowed');
                logoutText.textContent = "TERMINATING...";

                if (currentUser) {
                    // Update online status in Firestore before clearing session
                    await setDoc(doc(db, "users", currentUser.uid), { 
                        online: false,
                        lastSeen: serverTimestamp()
                    }, { merge: true });
                }

                // Execute Firebase Auth sign-out
                await signOut(auth);
                
                // Redirect user back to login page securely
                window.location.replace("index.html");
            } catch (error) {
                console.error("Logout Error:", error);
                logoutBtn.disabled = false;
                logoutBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                logoutText.textContent = "TERMINATE SESSION";
            }
        });
    </script>
</body>
</html>
