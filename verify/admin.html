<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Security - Realtime Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0e131f; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        
        .animate-fade-in {
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full text-gray-200 flex items-center justify-center p-0 md:p-6 overflow-hidden">

    <!-- Loading Screen (Removed automatically when authenticated) -->
    <div id="auth-loader" class="fixed inset-0 bg-[#0e131f] z-50 flex flex-col items-center justify-center gap-3">
        <div class="w-10 h-10 border-4 border-red-500/20 border-t-red-500 rounded-full animate-spin"></div>
        <p class="text-xs font-mono text-gray-400 uppercase tracking-widest">Loading Session...</p>
    </div>

    <!-- Main Application Card -->
    <div class="w-full h-full max-w-6xl bg-[#171d2d] md:rounded-2xl border border-white/10 flex overflow-hidden shadow-2xl relative">
        
        <!-- SIDEBAR: All Registered Firebase Users -->
        <aside class="w-80 bg-[#0e131f] border-r border-white/5 flex flex-col flex-shrink-0 z-20">
            <div class="p-4 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-red-600 to-orange-500 flex items-center justify-center font-bold text-white text-sm shadow-md">P</div>
                    <div>
                        <h1 class="font-bold text-white tracking-wide text-xs">PHANTOM CHAT</h1>
                        <p id="current-user-email" class="text-[10px] text-red-400 font-semibold truncate max-w-[130px]">Connecting...</p>
                    </div>
                </div>
                <button id="logout-btn" title="Logout" class="p-2 text-gray-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="p-3 border-b border-white/5 bg-[#121724]">
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">All Users Directory</p>
            </div>

            <!-- Users List Container -->
            <div id="users-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center py-6 text-xs text-gray-500">Loading active users...</div>
            </div>
        </aside>

        <!-- MAIN CHAT PANEL -->
        <main class="flex-1 flex flex-col bg-[#121724] relative">
            
            <!-- Chat Room Header -->
            <header id="chat-header" class="h-16 px-6 border-b border-white/5 flex items-center justify-between bg-[#171d2d]">
                <div class="flex items-center gap-3">
                    <div id="active-user-avatar" class="w-9 h-9 rounded-full bg-gray-700 flex items-center justify-center font-bold text-white text-xs border border-white/10">?</div>
                    <div>
                        <h2 id="active-user-name" class="text-sm font-bold text-white">Select a contact</h2>
                        <p id="active-user-status" class="text-[11px] text-gray-400">Click any user on the left sidebar to start messaging</p>
                    </div>
                </div>
            </header>

            <!-- Active Messages Area -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-3">
                <div class="h-full flex flex-col items-center justify-center text-gray-500 text-xs">
                    <i data-lucide="message-square" class="w-10 h-10 mb-2 opacity-30"></i>
                    Select a user from the directory to view or send messages
                </div>
            </div>

            <!-- Message Input Footer -->
            <footer class="p-4 bg-[#171d2d] border-t border-white/5">
                <form id="message-form" class="flex items-center gap-3">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Write a message..." 
                        class="w-full bg-[#0e131f] border border-white/10 text-sm text-gray-100 placeholder-gray-500 rounded-xl py-3 px-4 focus:outline-none focus:border-red-500 transition-all"
                        disabled 
                        required 
                        autocomplete="off"
                    />
                    <button 
                        type="submit" 
                        id="send-btn"
                        disabled
                        class="bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 disabled:opacity-40 text-white font-bold p-3 rounded-xl transition-all shadow-md flex items-center justify-center"
                    >
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1_m2aMJeAW93BKgQ0VUM9KdtzT2OZeLM",
            authDomain: "phantomsec-ca297.firebaseapp.com",
            databaseURL: "https://phantomsec-ca297-default-rtdb.firebaseio.com",
            projectId: "phantomsec-ca297",
            storageBucket: "phantomsec-ca297.firebasestorage.app",
            messagingSenderId: "15497490169",
            appId: "1:15497490169:web:a8454e1ed0fda9de04fc28"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const authLoader = document.getElementById('auth-loader');
        const usersListEl = document.getElementById('users-list');
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const currentUserEmailEl = document.getElementById('current-user-email');

        let currentUser = null;
        let selectedUser = null;
        let currentChatId = null;

        // 1. Monitor Authentication & Auto-index User to Database
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const username = user.email ? user.email.split('@')[0] : "User";
                currentUserEmailEl.textContent = user.email || username;

                // Index current user in RTDB so other users can find them instantly
                update(ref(db, `users/${user.uid}`), {
                    uid: user.uid,
                    email: user.email || `${username}@phantomsec.com`,
                    displayName: username
                });

                if (authLoader) authLoader.remove();
                loadUsersDirectory();
            } else {
                // If not logged in, return to login page
                window.location.href = "index.html";
            }
        });

        // 2. Real-time User Directory Listing
        function loadUsersDirectory() {
            onValue(ref(db, 'users'), (snapshot) => {
                usersListEl.innerHTML = '';
                const data = snapshot.val() || {};
                const users = Object.values(data);

                if (users.length <= 1) {
                    usersListEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No other users online yet.</p>`;
                    return;
                }

                users.forEach((u) => {
                    if (u.uid === currentUser.uid) return; // Don't list yourself

                    const isSelected = selectedUser && selectedUser.uid === u.uid;
                    const item = document.createElement('div');
                    item.className = `p-2.5 rounded-xl flex items-center gap-3 cursor-pointer transition-all ${
                        isSelected ? 'bg-red-500/20 border border-red-500/30' : 'hover:bg-white/5'
                    }`;
                    item.innerHTML = `
                        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-rose-700 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                            ${(u.displayName || 'U').charAt(0).toUpperCase()}
                        </div>
                        <div class="overflow-hidden">
                            <p class="text-xs font-semibold text-white truncate">${u.displayName}</p>
                            <p class="text-[10px] text-gray-400 truncate">${u.email}</p>
                        </div>
                    `;
                    item.addEventListener('click', () => selectUserChat(u));
                    usersListEl.appendChild(item);
                });
            });
        }

        // 3. Open Direct Chat Room
        function selectUserChat(targetUser) {
            selectedUser = targetUser;
            
            // Unique Room Identifier for 2 users (alphabetical UID sorting prevents room duplicates)
            currentChatId = [currentUser.uid, targetUser.uid].sort().join('_');

            document.getElementById('active-user-name').textContent = targetUser.displayName;
            document.getElementById('active-user-status').textContent = targetUser.email;
            document.getElementById('active-user-avatar').textContent = targetUser.displayName.charAt(0).toUpperCase();

            messageInput.disabled = false;
            sendBtn.disabled = false;

            loadUsersDirectory(); // Re-render sidebar to update highlight styling
            listenToChatRoom(currentChatId);
        }

        // 4. Listen to Messages in 100% Real Time
        function listenToChatRoom(chatId) {
            chatBox.innerHTML = '';
            const roomRef = ref(db, `direct_chats/${chatId}`);

            onValue(roomRef, (snapshot) => {
                chatBox.innerHTML = '';
                const messages = snapshot.val() || {};

                if (Object.keys(messages).length === 0) {
                    chatBox.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-gray-500 text-xs">
                            <p>No messages yet. Say hello to ${selectedUser.displayName}!</p>
                        </div>
                    `;
                    return;
                }

                Object.entries(messages).forEach(([key, msg]) => {
                    const isMe = msg.senderUid === currentUser.uid;
                    const wrapper = document.createElement('div');
                    wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fade-in group`;

                    wrapper.innerHTML = `
                        <div class="flex items-end gap-2 max-w-[80%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                            <div class="px-4 py-2.5 rounded-2xl text-xs leading-relaxed shadow-lg ${
                                isMe ? 'bg-gradient-to-r from-red-700 to-orange-700 text-white rounded-br-none' : 'bg-[#1e2638] text-gray-100 rounded-bl-none'
                            }">
                                ${escapeHtml(msg.text)}
                                <span class="text-[9px] opacity-60 block text-right mt-1">${msg.timestamp}</span>
                            </div>
                            <button data-key="${key}" class="delete-btn p-1 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" title="Delete message">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    `;

                    chatBox.appendChild(wrapper);

                    // Allow deleting messages
                    const deleteBtn = wrapper.querySelector('.delete-btn');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', () => {
                            remove(ref(db, `direct_chats/${chatId}/${key}`));
                        });
                    }
                });

                lucide.createIcons();
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // 5. Send Real-Time Message
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();

            if (text && currentChatId) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                push(ref(db, `direct_chats/${currentChatId}`), {
                    senderUid: currentUser.uid,
                    text: text,
                    timestamp: timeStr
                });

                messageInput.value = '';
            }
        });

        // 6. Handle Logout
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        lucide.createIcons();
    </script>
</body>
</html>
