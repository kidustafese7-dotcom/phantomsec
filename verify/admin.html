<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantomgram - Telegram Style Web Messenger</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f141f; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        .animate-fade-in {
            animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bg {
            background-color: #0b0f17;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-full text-gray-200 flex items-center justify-center p-0 md:p-4 overflow-hidden">

    <!-- Auth / Profile Modal (Appears on first launch if no profile stored) -->
    <div id="auth-modal" class="fixed inset-0 bg-[#0f141f]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-[#171d2c] border border-white/10 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col gap-5 animate-fade-in">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    <i data-lucide="send" class="w-6 h-6 -ml-0.5"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white tracking-wide">Welcome to Phantomgram</h2>
                    <p class="text-xs text-gray-400">Enter your name to join the global real-time network</p>
                </div>
            </div>
            
            <form id="auth-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Your Display Name</label>
                    <input 
                        type="text" 
                        id="display-name-input" 
                        placeholder="e.g. Kidus M." 
                        class="w-full bg-[#0f141f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-sky-500 transition-all"
                        required 
                        autocomplete="off"
                        maxlength="25"
                    />
                </div>
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2"
                >
                    Start Messaging <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Main Telegram UI Shell -->
    <div class="w-full h-full max-w-6xl bg-[#131924] md:rounded-2xl border border-white/10 flex overflow-hidden shadow-2xl relative">
        
        <!-- SIDEBAR: Chats List & Global Directory -->
        <aside class="w-full md:w-80 lg:w-96 bg-[#171d2c] border-r border-white/5 flex flex-col flex-shrink-0 z-20">
            
            <!-- Sidebar Header -->
            <div class="p-3.5 border-b border-white/5 flex items-center justify-between bg-[#171d2c]">
                <div class="flex items-center gap-3">
                    <div id="user-avatar-preview" class="w-9 h-9 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-bold text-white text-xs shadow-md">U</div>
                    <div class="overflow-hidden">
                        <h1 id="current-username-display" class="font-bold text-white tracking-wide text-xs truncate">Guest</h1>
                        <p class="text-[10px] text-emerald-400 font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online
                        </p>
                    </div>
                </div>
                <button id="change-profile-btn" title="Change Name" class="p-2 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="p-3 border-b border-white/5 bg-[#171d2c]">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3.5 top-3"></i>
                    <input 
                        type="text" 
                        id="search-contacts" 
                        placeholder="Search users..." 
                        class="w-full bg-[#0f141f] border border-white/5 rounded-xl pl-10 pr-4 py-2 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-sky-500 transition-all"
                        autocomplete="off"
                    />
                </div>
            </div>

            <!-- Users Directory List -->
            <div id="users-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center py-8 text-xs text-gray-500">Loading network users...</div>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="flex-1 flex flex-col chat-bg relative hidden md:flex">
            
            <!-- Chat Header -->
            <header id="chat-header" class="h-16 px-6 border-b border-white/5 flex items-center justify-between bg-[#171d2c]/80 backdrop-blur-md z-10">
                <div class="flex items-center gap-3">
                    <button id="back-to-sidebar-btn" class="md:hidden p-1.5 text-gray-400 hover:text-white mr-1">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <div id="active-user-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-gray-700 to-gray-800 flex items-center justify-center font-bold text-white text-xs border border-white/10 shadow-inner">?</div>
                    <div>
                        <h2 id="active-user-name" class="text-sm font-bold text-white">Select a chat</h2>
                        <p id="active-user-status" class="text-[11px] text-gray-400">Choose a contact from the sidebar</p>
                    </div>
                </div>
            </header>

            <!-- Messages Box -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-3">
                <div class="h-full flex flex-col items-center justify-center text-gray-500 text-xs gap-2">
                    <div class="w-14 h-14 rounded-full bg-white/5 flex items-center justify-center mb-1">
                        <i data-lucide="message-square" class="w-6 h-6 text-gray-600"></i>
                    </div>
                    <p>Select any user from the left to start instant real-time messaging</p>
                </div>
            </div>

            <!-- Message Input Footer -->
            <footer class="p-4 bg-[#171d2c]/80 backdrop-blur-md border-t border-white/5 z-10">
                <form id="message-form" class="flex items-center gap-3">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Write a message..." 
                        class="w-full bg-[#0f141f] border border-white/10 text-sm text-gray-100 placeholder-gray-500 rounded-xl py-3 px-4 focus:outline-none focus:border-sky-500 transition-all"
                        disabled 
                        required 
                        autocomplete="off"
                    />
                    <button 
                        type="submit" 
                        id="send-btn"
                        disabled
                        class="bg-sky-500 hover:bg-sky-400 disabled:opacity-30 text-white font-bold p-3 rounded-xl transition-all shadow-lg flex items-center justify-center cursor-pointer"
                    >
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1_m2aMJeAW93BKgQ0VUM9KdtzT2OZeLM",
            authDomain: "phantomsec-ca297.firebaseapp.com",
            databaseURL: "https://phantomsec-ca297-default-rtdb.firebaseio.com",
            projectId: "phantomsec-ca297",
            storageBucket: "phantomsec-ca297.firebasestorage.app",
            messagingSenderId: "15497490169",
            appId: "1:15497490169:web:a8454e1ed0fda9de04fc28"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State variables
        let myUid = localStorage.getItem('phantomgram_uid');
        let myName = localStorage.getItem('phantomgram_name');
        let selectedUser = null;
        let currentChatId = null;

        // DOM elements
        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const displayNameInput = document.getElementById('display-name-input');
        const currentUsernameDisplay = document.getElementById('current-username-display');
        const userAvatarPreview = document.getElementById('user-avatar-preview');
        const changeProfileBtn = document.getElementById('change-profile-btn');
        const usersListEl = document.getElementById('users-list');
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const searchContacts = document.getElementById('search-contacts');

        // Initialize User Identity
        if (!myUid) {
            myUid = 'user_' + Math.random().toString(36.substring(2, 9));
            localStorage.setItem('phantomgram_uid', myUid);
        }

        if (myName) {
            authModal.classList.add('hidden');
            currentUsernameDisplay.textContent = myName;
            userAvatarPreview.textContent = myName.charAt(0).toUpperCase();
            registerUserInDb();
        }

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nameVal = displayNameInput.value.trim();
            if (nameVal) {
                myName = nameVal;
                localStorage.setItem('phantomgram_name', myName);
                currentUsernameDisplay.textContent = myName;
                userAvatarPreview.textContent = myName.charAt(0).toUpperCase();
                authModal.classList.add('hidden');
                registerUserInDb();
            }
        });

        changeProfileBtn.addEventListener('click', () => {
            displayNameInput.value = myName || '';
            authModal.classList.remove('hidden');
        });

        function registerUserInDb() {
            set(ref(db, `users/${myUid}`), {
                uid: myUid,
                name: myName,
                lastSeen: serverTimestamp()
            });
            loadUsersDirectory();
        }

        let allUsersCache = {};

        // Load Global Users Directory in Real Time
        function loadUsersDirectory() {
            onValue(ref(db, 'users'), (snapshot) => {
                allUsersCache = snapshot.val() || {};
                renderUsersList();
            });
        }

        function renderUsersList(filter = '') {
            usersListEl.innerHTML = '';
            const users = Object.values(allUsersCache);

            const filtered = users.filter(u => u.uid !== myUid && u.name.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                usersListEl.innerHTML = `<div class="text-center py-8 text-xs text-gray-500">No other users found.</div>`;
                return;
            }

            filtered.forEach(u => {
                const isSelected = selectedUser && selectedUser.uid === u.uid;
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl flex items-center gap-3 cursor-pointer transition-all ${
                    isSelected ? 'bg-sky-500/15 border border-sky-500/30' : 'hover:bg-white/5'
                }`;
                item.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0">
                        ${u.name.charAt(0).toUpperCase()}
                    </div>
                    <div class="overflow-hidden flex-1">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-semibold text-white truncate">${u.name}</p>
                        </div>
                        <p class="text-[11px] text-gray-400 truncate mt-0.5">Tap to chat instantly</p>
                    </div>
                `;
                item.addEventListener('click', () => {
                    selectUserChat(u);
                    // On mobile, hide sidebar or adjust view if needed
                });
                usersListEl.appendChild(item);
            });
        }

        searchContacts.addEventListener('input', (e) => {
            renderUsersList(e.target.value);
        });

        // Open Direct Chat Room
        function selectUserChat(targetUser) {
            selectedUser = targetUser;
            // Generate deterministic room ID by sorting UIDs alphabetically
            currentChatId = [myUid, targetUser.uid].sort().join('_');

            document.getElementById('active-user-name').textContent = targetUser.name;
            document.getElementById('active-user-status').textContent = "online";
            document.getElementById('active-user-avatar').textContent = targetUser.name.charAt(0).toUpperCase();

            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();

            renderUsersList(searchContacts.value);
            listenToChatRoom(currentChatId);
        }

        // Listen to Messages in 100% Real Time
        function listenToChatRoom(chatId) {
            chatBox.innerHTML = '';
            const roomRef = ref(db, `chats/${chatId}`);

            onValue(roomRef, (snapshot) => {
                chatBox.innerHTML = '';
                const messages = snapshot.val() || {};

                if (Object.keys(messages).length === 0) {
                    chatBox.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-gray-500 text-xs">
                            <p>No messages yet. Send a greeting to ${selectedUser.name}!</p>
                        </div>
                    `;
                    return;
                }

                Object.entries(messages).forEach(([key, msg]) => {
                    const isMe = msg.senderUid === myUid;
                    const wrapper = document.createElement('div');
                    wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fade-in group`;

                    wrapper.innerHTML = `
                        <div class="flex items-end gap-2 max-w-[80%] md:max-w-[65%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                            <div class="px-3.5 py-2 rounded-2xl text-xs leading-relaxed shadow-md ${
                                isMe ? 'bg-[#2b5278] text-white rounded-br-none' : 'bg-[#182233] text-gray-100 rounded-bl-none border border-white/5'
                            }">
                                ${escapeHtml(msg.text)}
                                <div class="text-[9px] opacity-60 flex items-center justify-end gap-1 mt-1">
                                    ${msg.timestamp}
                                    ${isMe ? '<span class="text-sky-300">✓✓</span>' : ''}
                                </div>
                            </div>
                            <button data-key="${key}" class="delete-btn p-1 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" title="Delete message">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    `;

                    chatBox.appendChild(wrapper);

                    // Message deletion handler
                    const deleteBtn = wrapper.querySelector('.delete-btn');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', () => {
                            remove(ref(db, `chats/${chatId}/${key}`));
                        });
                    }
                });

                lucide.createIcons();
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // Send Message Handler
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();

            if (text && currentChatId) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                push(ref(db, `chats/${currentChatId}`), {
                    senderUid: myUid,
                    senderName: myName,
                    text: text,
                    timestamp: timeStr
                });

                messageInput.value = '';
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        lucide.createIcons();
    </script>
</body>
</html>
