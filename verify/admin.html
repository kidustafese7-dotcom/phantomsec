<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Web - Secure Chat</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#07090e',
                            800: '#0e131f',
                            700: '#171d2d',
                            600: '#232a3d',
                        },
                        brand: {
                            500: '#10b981',
                            600: '#059669',
                            glow: '#00ffcc',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07090e;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
        }
        
        /* Glassmorphism Blur Effects */
        .glass-panel {
            background: rgba(14, 19, 31, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glass-input {
            background: rgba(23, 29, 45, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input:focus {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.4); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full text-gray-200 antialiased flex items-center justify-center p-0 md:p-6 overflow-hidden">

    <!-- Main Container Card -->
    <div class="w-full h-full max-w-6xl glass-panel md:rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] flex overflow-hidden relative">
        
        <!-- SIDEBAR: Channels & Nav -->
        <aside class="w-20 md:w-72 bg-dark-800/90 border-r border-white/5 flex flex-col justify-between flex-shrink-0 z-20 transition-all duration-300">
            <div>
                <!-- Brand Logo Header -->
                <div class="p-4 md:p-5 flex items-center justify-between border-b border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                            <i data-lucide="shield-check" class="w-5 h-5"></i>
                        </div>
                        <div class="hidden md:block">
                            <h1 class="font-mono font-bold text-sm tracking-wider text-white">PHANTOM</h1>
                            <p class="text-[10px] text-brand-500 font-semibold tracking-widest uppercase">ENCRYPTED</p>
                        </div>
                    </div>
                </div>

                <!-- Channel List -->
                <div class="p-3 space-y-6">
                    <div>
                        <p class="hidden md:block text-[10px] font-mono font-semibold text-gray-400 px-3 uppercase tracking-widest mb-2">Channels</p>
                        <nav class="space-y-1">
                            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-brand-500/10 text-brand-500 border border-brand-500/20 font-medium text-sm transition-all">
                                <i data-lucide="hash" class="w-4 h-4"></i>
                                <span class="hidden md:block">general-chat</span>
                            </button>
                            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-gray-200 hover:bg-white/5 font-medium text-sm transition-all">
                                <i data-lucide="hash" class="w-4 h-4"></i>
                                <span class="hidden md:block">cyber-lounge</span>
                            </button>
                            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-gray-200 hover:bg-white/5 font-medium text-sm transition-all">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                                <span class="hidden md:block">announcements</span>
                            </button>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Profile & Logout Section -->
            <div class="p-3 border-t border-white/5 bg-dark-900/40">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="relative">
                            <div id="user-avatar" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shadow-md">
                                ?
                            </div>
                            <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-brand-500 border-2 border-dark-800 rounded-full"></div>
                        </div>
                        <div class="hidden md:block truncate">
                            <p id="user-display-name" class="text-xs font-semibold text-white truncate">Loading...</p>
                            <p id="user-status-text" class="text-[10px] text-gray-400">Online</p>
                        </div>
                    </div>

                    <button id="logout-btn" title="Logout" class="p-2 text-gray-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT PANEL -->
        <main class="flex-1 flex flex-col bg-dark-900/50 backdrop-blur-md relative overflow-hidden">
            
            <!-- Chat Header -->
            <header class="h-16 px-6 border-b border-white/5 flex items-center justify-between glass-panel z-10">
                <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-brand-500 animate-pulse shadow-[0_0_8px_#10b981]"></div>
                    <div>
                        <h2 class="text-sm font-bold text-white tracking-wide"># general-chat</h2>
                        <p class="text-[11px] text-gray-400">Encrypted real-time channel</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 text-gray-400">
                    <button class="p-2 hover:bg-white/5 rounded-lg transition-colors"><i data-lucide="search" class="w-4 h-4"></i></button>
                    <button class="p-2 hover:bg-white/5 rounded-lg transition-colors"><i data-lucide="bell" class="w-4 h-4"></i></button>
                    <button class="p-2 hover:bg-white/5 rounded-lg transition-colors"><i data-lucide="shield" class="w-4 h-4 text-brand-500"></i></button>
                </div>
            </header>

            <!-- Message Stream Area -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                <!-- Dynamic messages inject here -->
            </div>

            <!-- Chat Input Area -->
            <footer class="p-4 bg-dark-800/80 border-t border-white/5 relative z-10">
                <form id="message-form" class="flex items-center gap-3">
                    <div class="flex-1 relative">
                        <input 
                            type="text" 
                            id="message-input" 
                            placeholder="Type a secure message..." 
                            class="w-full glass-input text-sm text-gray-100 placeholder-gray-500 rounded-2xl py-3.5 pl-4 pr-12 focus:outline-none transition-all"
                            required 
                            autocomplete="off"
                        />
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1 text-gray-400">
                            <button type="button" class="p-1.5 hover:text-white transition-colors"><i data-lucide="smile" class="w-4 h-4"></i></button>
                            <button type="button" class="p-1.5 hover:text-white transition-colors"><i data-lucide="paperclip" class="w-4 h-4"></i></button>
                        </div>
                    </div>

                    <button 
                        type="submit" 
                        class="bg-gradient-to-r from-brand-500 to-teal-500 hover:from-brand-600 hover:to-teal-600 text-dark-900 font-bold p-3.5 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.3)] transition-all flex items-center justify-center group"
                    >
                        <i data-lucide="send" class="w-5 h-5 transition-transform group-hover:translate-x-0.5"></i>
                    </button>
                </form>
            </footer>

        </main>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1_m2aMJeAW93BKgQ0VUM9KdtzT2OZeLM",
            authDomain: "phantomsec-ca297.firebaseapp.com",
            databaseURL: "https://phantomsec-ca297-default-rtdb.firebaseio.com",
            projectId: "phantomsec-ca297",
            storageBucket: "phantomsec-ca297.firebasestorage.app",
            messagingSenderId: "15497490169",
            appId: "1:15497490169:web:a8454e1ed0fda9de04fc28",
            measurementId: "G-G0LKRPYMXW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const messagesRef = ref(db, 'chat_messages');

        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const logoutBtn = document.getElementById('logout-btn');
        const userDisplayName = document.getElementById('user-display-name');
        const userAvatar = document.getElementById('user-avatar');

        let currentUser = null;

        // Authentication state observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const name = user.email ? user.email.split('@')[0] : "Agent";
                userDisplayName.textContent = name;
                userAvatar.textContent = name.charAt(0).toUpperCase();
            } else {
                window.location.href = "index.html"; // Redirect to login if unauthenticated
            }
        });

        // Logout listener
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

        // Send Message
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();

            if (text && currentUser) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const senderName = currentUser.email ? currentUser.email.split('@')[0] : "Agent";

                push(messagesRef, {
                    uid: currentUser.uid,
                    senderName: senderName,
                    text: text,
                    timestamp: timeStr
                });

                messageInput.value = '';
            }
        });

        // Render Received Messages
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            const isMe = currentUser && (data.uid === currentUser.uid);

            const msgWrapper = document.createElement('div');
            msgWrapper.id = `msg-${key}`;
            msgWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fade-in group`;

            const initial = (data.senderName || 'A').charAt(0).toUpperCase();

            msgWrapper.innerHTML = `
                <div class="flex items-end gap-2.5 max-w-[85%] md:max-w-[70%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-md ${isMe ? 'bg-gradient-to-tr from-brand-500 to-teal-400 text-dark-900' : 'bg-dark-700 text-gray-300 border border-white/10'}">
                        ${initial}
                    </div>

                    <div class="space-y-1">
                        <div class="flex items-center gap-2 ${isMe ? 'justify-end' : 'justify-start'} px-1">
                            <span class="text-[11px] font-semibold text-gray-400">${isMe ? 'You' : data.senderName}</span>
                            <span class="text-[10px] text-gray-500">${data.timestamp || ''}</span>
                        </div>

                        <div class="relative group/bubble">
                            <div class="px-4 py-2.5 rounded-2xl text-sm leading-relaxed shadow-lg ${isMe ? 'bg-gradient-to-r from-brand-600 to-teal-600 text-white rounded-br-xs' : 'bg-dark-700/80 text-gray-100 border border-white/5 rounded-bl-xs'}">
                                ${escapeHtml(data.text)}
                            </div>

                            ${isMe ? `
                                <button data-key="${key}" class="delete-btn absolute -left-12 top-1/2 -translate-y-1/2 opacity-0 group-hover/bubble:opacity-100 p-1.5 text-gray-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-all">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;

            chatBox.appendChild(msgWrapper);
            lucide.createIcons();
            chatBox.scrollTop = chatBox.scrollHeight;

            // Delete handling
            const deleteBtn = msgWrapper.querySelector('.delete-btn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', () => {
                    remove(ref(db, `chat_messages/${key}`));
                });
            }
        });

        // Realtime deletion handler
        onChildRemoved(messagesRef, (snapshot) => {
            const key = snapshot.key;
            const element = document.getElementById(`msg-${key}`);
            if (element) element.remove();
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        lucide.createIcons();
    </script>
</body>
</html>
